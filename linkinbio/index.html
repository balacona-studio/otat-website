<script>
// Deep-link attempt with web fallback: try the native app first;
// if the app does not take over (page still visible), fall back to the web URL.
function appJump(appUrl, webUrl) {
  var jumped = false;
  function onHide() { jumped = true; }
  document.addEventListener("visibilitychange", onHide);
  window.addEventListener("pagehide", onHide);
  window.location.href = appUrl;
  setTimeout(function () {
    document.removeEventListener("visibilitychange", onHide);
    window.removeEventListener("pagehide", onHide);
    if (!jumped && !document.hidden) { window.location.href = webUrl; }
  }, 1400);
}
document.getElementById("ytBtn").addEventListener("click", function (e) {
  e.preventDefault();
  appJump("youtube://watch?v=PtMwXhSpEnE", "https://www.youtube.com/watch?v=PtMwXhSpEnE");
});
document.getElementById("spBtn").addEventListener("click", function (e) {
  e.preventDefault();
  appJump("spotify:album:35lcYvl7Zq4BRfozzhLDph", "https://open.spotify.com/album/35lcYvl7Zq4BRfozzhLDph");
});
</script>
